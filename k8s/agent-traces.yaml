apiVersion: v1
kind: Namespace
metadata:
  name: aseity
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-traces
  namespace: aseity
  labels:
    app.kubernetes.io/name: agent-traces
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-traces
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-traces
    spec:
      containers:
        - name: web
          image: 192.168.8.88:5300/agent-traces:standalone
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: agent-traces-env
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: agent-traces
  namespace: aseity
  labels:
    app.kubernetes.io/name: agent-traces
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: agent-traces
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 32282
